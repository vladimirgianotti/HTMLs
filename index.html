<title>Conversões de Tubulação</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: coluna lateral com navegação por grandeza; à direita o conversor "digite uma vez, veja todas as unidades". */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --ink:#13222c; --muted:#5a6b77; --line:#d3dce2;
  --accent:#0e5f80; --accent-ink:#ffffff; --tint:#e1eff5; --hover:#e8eef2;
  --f-display:'Barlow Semi Condensed',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f171d; --surface:#16212a; --ink:#e3ebf0; --muted:#8c9eab; --line:#2a3a46;
    --accent:#62c3e6; --accent-ink:#06222e; --tint:#17323f; --hover:#1d2c37; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#16212a; --ink:#e3ebf0; --muted:#8c9eab; --line:#2a3a46;
  --accent:#62c3e6; --accent-ink:#06222e; --tint:#17323f; --hover:#1d2c37; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-body);
  padding-block:24px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.app{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:232px minmax(0,1fr); gap:40px; align-items:start}
.side{position:sticky; top:24px; display:flex; flex-direction:column; gap:22px; max-height:calc(100vh - 48px); overflow-y:auto; padding-right:4px}
.brand{display:flex; align-items:center; gap:12px; color:var(--accent)}
.brand strong{display:block; font:700 21px/1.1 var(--f-display); color:var(--ink); letter-spacing:.01em}
.brand span{font-size:12.5px; color:var(--muted)}
#nav{display:flex; flex-direction:column; gap:16px}
.grp{display:flex; flex-direction:column; gap:1px}
.grp h2{margin:0 0 4px; font:600 11px/1.3 var(--f-body); letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
#nav a{display:block; padding:5px 10px; margin-left:-10px; border-radius:4px; color:var(--ink); text-decoration:none}
#nav a:hover{background:var(--hover)}
#nav a[aria-current="page"]{background:var(--tint); color:var(--accent); font-weight:600}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.foot{margin:0; font-size:12px; color:var(--muted); max-width:30ch}

main{min-width:0}
.head h1{margin:0; font:700 34px/1.1 var(--f-display); letter-spacing:.005em; text-wrap:balance}
.sub{margin:8px 0 0; color:var(--muted); max-width:65ch}
.entry{margin-top:26px; display:flex; flex-direction:column; gap:10px}
label{font-size:12.5px; font-weight:500; color:var(--muted)}
input,select{
  font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line);
  border-radius:4px; padding:9px 11px; min-width:0;
}
input{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.entry-row{display:flex; gap:10px; flex-wrap:wrap}
.entry-row input{font-size:28px; padding:8px 12px; width:min(100%,300px)}
.entry-row select{font-size:18px; min-width:150px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font:inherit; font-size:13px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:999px; padding:3px 11px; cursor:pointer}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.results{margin-top:28px; display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); column-gap:28px; border-top:1px solid var(--line)}
.row{display:grid; grid-template-columns:minmax(0,1fr) 40px; border-bottom:1px solid var(--line)}
.row.src{background:var(--tint)}
.pick{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:2px 14px; text-align:left; padding:10px 8px; background:none; border:0; color:inherit; font:inherit; cursor:pointer; min-width:0}
button.pick:hover{background:var(--hover)}
.row.src button.pick:hover{background:none}
div.pick{cursor:default}
.pick .l{display:flex; flex-direction:column; min-width:0}
.sym{font:500 14.5px var(--f-mono); color:var(--accent)}
.src .sym::after{content:"origem"; font:600 10px var(--f-body); letter-spacing:.08em; text-transform:uppercase; margin-left:8px; color:var(--muted)}
.uname{font-size:12.5px; color:var(--muted); overflow-wrap:anywhere}
.val{font:500 18px var(--f-mono); font-variant-numeric:tabular-nums; text-align:right; overflow-wrap:anywhere}
.val sup{font-size:.6em}
.copy{background:none; border:0; color:var(--muted); cursor:pointer; display:grid; place-items:center}
.copy:hover{color:var(--accent)}
.note{margin:22px 0 0; font-size:13px; color:var(--muted); max-width:65ch}

.form{margin-top:26px; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px 24px}
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.ctl{display:flex; gap:8px}
.ctl input{flex:1}
.ctl select{flex:none; max-width:55%}
.field>input,.field>select{width:100%}
h2.sec{margin:34px 0 0; font:600 12px/1.3 var(--f-body); letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.out{margin-top:10px; display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); column-gap:28px}
.o{border-top:1px solid var(--line); padding:10px 0 14px}
.o span{display:block; font-size:12.5px; color:var(--muted)}
.o b{display:block; font:500 24px/1.3 var(--f-mono); font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.o small{font:400 13px var(--f-body); color:var(--muted)}
.tag{display:inline-block; font:600 13px var(--f-body); padding:1px 9px; border-radius:999px; background:var(--tint); color:var(--accent)}

.tablewrap{margin-top:22px; overflow-x:auto; border-top:1px solid var(--line)}
table{border-collapse:collapse; width:100%; min-width:640px; font-variant-numeric:tabular-nums}
th{font:600 11px/1.3 var(--f-body); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); text-align:right; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
td{font:400 14px var(--f-mono); text-align:right; padding:8px 12px; border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child{font-weight:500; color:var(--accent)}
tbody tr:hover{background:var(--hover)}
.search{margin-top:24px; width:min(100%,340px)}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(8px); background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:4px; font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .15s, transform .15s; max-width:90vw; overflow-wrap:anywhere}
.toast.show{opacity:1; transform:translateX(-50%)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr); gap:20px}
  .side{position:static; max-height:none; overflow:visible; padding:0; gap:12px}
  #nav{flex-direction:row; gap:6px; overflow-x:auto; padding-bottom:8px}
  .grp{flex-direction:row; gap:6px}
  .grp h2{display:none}
  #nav a{flex:none; white-space:nowrap; margin:0; border:1px solid var(--line); border-radius:999px; padding:4px 13px}
  #nav a[aria-current="page"]{border-color:var(--accent)}
  .foot{display:none}
  .head h1{font-size:28px}
  .entry-row input{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

  s=String(s).replace(/[\s  ]/g,'');

],[0.04,'W/(m·K)']);

add('troca-termica','Coeficiente de troca térmica','Coeficiente global (U) ou de película (h).',[
  u('W/(m²·K)','watt por metro²-kelvin',1),u('kcal/(h·m²·°C)','quilocaloria por hora-metro²-°C',1.163),
  u('BTU/(h·ft²·°F)','BTU por hora-pé²-°F',5.678263341)
],[100,'W/(m²·K)']);

/* ---------- dados de tubos: ASME B36.10M / B36.19M ----------
   [DN, NPS, DE mm, esp. Sch 40 mm, esp. Sch 80 mm] */
var PIPES=[
 [6,'1/8',10.3,1.73,2.41],[8,'1/4',13.7,2.24,3.02],[10,'3/8',17.1,2.31,3.20],[15,'1/2',21.3,2.77,3.73],
 [20,'3/4',26.7,2.87,3.91],[25,'1',33.4,3.38,4.55],[32,'1 1/4',42.2,3.56,4.85],[40,'1 1/2',48.3,3.68,5.08],
 [50,'2',60.3,3.91,5.54],[65,'2 1/2',73.0,5.16,7.01],[80,'3',88.9,5.49,7.62],[90,'3 1/2',101.6,5.74,8.08],
 [100,'4',114.3,6.02,8.56],[125,'5',141.3,6.55,9.53],[150,'6',168.3,7.11,10.97],[200,'8',219.1,8.18,12.70],
 [250,'10',273.1,9.27,15.09],[300,'12',323.9,10.31,17.48],[350,'14',355.6,11.13,19.05],[400,'16',406.4,12.70,21.44],
 [450,'18',457.2,14.27,23.83],[500,'20',508.0,15.09,26.19],[600,'24',609.6,17.48,30.96]
];
var FR={'1/8':'⅛','1/4':'¼','3/8':'⅜','1/2':'½','3/4':'¾','1 1/4':'1¼','1 1/2':'1½','2 1/2':'2½','3 1/2':'3½'};
function npsLabel(n){return FR[n]||n}
function npsNum(n){var p=n.split(' ');var t=0;p.forEach(function(x){if(x.indexOf('/')>-1){var f=x.split('/');t+=f[0]/f[1]}else t+=Number(x)});return t}

/* ---------- peças de interface ---------- */
function head(t,n){return '<header class="head"><h1>'+esc(t)+'</h1>'+(n?'<p class="sub">'+esc(n)+'</p>':'')+'</header>'}
function opts(units,sel){return units.map(function(x,i){return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+esc(x.sym)+'</option>'}).join('')}
function chipsHTML(list){return list.map(function(c,i){return '<button type="button" class="chip" data-c="'+i+'">'+esc(c[c.length-1])+'</button>'}).join('')}
var COPYSVG='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.500 2h-6A1.5 1.5 0 0 0 2 3.500v6A1.5 1.5 0 0 0 3.500 11H5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';

/* ---------- conversor genérico ---------- */
var STATE={};
function viewConv(cat){
  var st=STATE[cat.id]||(STATE[cat.id]={val:fmtCopy(cat.def[0]),unit:cat.units.map(function(x){return x.sym}).indexOf(cat.def[1])});
  root.innerHTML=head(cat.name,cat.note)+
   '<section class="entry"><label for="v">Valor</label><div class="entry-row">'+
   '<input id="v" inputmode="decimal" autocomplete="off" spellcheck="false" value="'+esc(st.val)+'">'+
   '<select id="u" aria-label="Unidade de origem">'+opts(cat.units,st.unit)+'</select></div>'+
   (cat.quick.length?'<div class="chips" aria-label="Valores de referência">'+chipsHTML(cat.quick)+'</div>':'')+
   '</section><div class="results" id="res"></div>'+
   '<p class="note">Clique em qualquer linha para usá-la como unidade de origem. O botão ao lado copia o número.</p>';
  var inp=$('#v'),sel=$('#u'),res=$('#res');
  function run(){
    st.val=inp.value; st.unit=+sel.value;
    var v=parse(inp.value), su=cat.units[st.unit], ok=isFinite(v), b=ok?toBase(su,v):NaN, h='';
    cat.units.forEach(function(un,i){
      var x=ok?fromBase(un,b):NaN;
      h+='<div class="row'+(i===st.unit?' src':'')+'"><button type="button" class="pick" data-i="'+i+'" title="Usar como origem">'+
        '<span class="l"><span class="sym">'+esc(un.sym)+'</span><span class="uname">'+esc(un.name)+'</span></span>'+
        '<span class="val">'+fmtHTML(x)+'</span></button>'+
        '<button type="button" class="copy" data-t="'+esc(fmtCopy(x))+'" aria-label="Copiar valor em '+esc(un.sym)+'">'+COPYSVG+'</button></div>';
    });
    if(cat.extra&&ok){cat.extra(b).forEach(function(e){
      h+='<div class="row"><div class="pick"><span class="l"><span class="sym">'+esc(e.sym)+'</span><span class="uname">'+esc(e.name)+'</span></span><span class="val">'+esc(e.text)+'</span></div>'+
        '<button type="button" class="copy" data-t="'+esc(e.text)+'" aria-label="Copiar">'+COPYSVG+'</button></div>'});}
    res.innerHTML=h;
  }
  inp.addEventListener('input',run); sel.addEventListener('change',run);
  res.addEventListener('click',function(e){
    var c=e.target.closest('.copy'); if(c){copyText(c.getAttribute('data-t'));return}
    var p=e.target.closest('button.pick'); if(!p)return;
    var i=+p.getAttribute('data-i'), v=parse(inp.value);
    if(isFinite(v)&&i!==+sel.value){var x=fromBase(cat.units[i],toBase(cat.units[+sel.value],v));inp.value=fmtCopy(x)}
    sel.value=String(i); run();
  });
  var chips=root.querySelector('.chips');
  if(chips)chips.addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b)return;
    var q=cat.quick[+b.getAttribute('data-c')];
    inp.value=fmtCopy(q[0]); sel.value=String(cat.units.map(function(x){return x.sym}).indexOf(q[1])); run();
  });
  run();
}

/* ---------- tabela DN / NPS ---------- */
function viewTable(){
  root.innerHTML=head('Tabela DN / NPS','Diâmetro externo e espessura de parede pela ASME B36.10M. O diâmetro interno é calculado como DE − 2 × espessura.')+
   '<input class="search" id="q" type="search" inputmode="decimal" placeholder="Buscar por DN ou NPS (ex.: 100 ou 4)" aria-label="Buscar por DN ou NPS" autocomplete="off">'+
   '<div class="tablewrap"><table><thead><tr><th>DN</th><th>NPS (pol)</th><th>DE mm</th><th>DE pol</th>'+
   '<th>Sch 40 esp.</th><th>Sch 40 DI</th><th>Sch 80 esp.</th><th>Sch 80 DI</th></tr></thead><tbody id="tb"></tbody></table></div>'+
   '<p class="note">Medidas em mm, exceto onde indicado. DN segue a ISO 6708; NPS é a designação nominal em polegadas.</p>';
  var q=$('#q'),tb=$('#tb');
  function draw(){
    var s=q.value.trim(), rows=PIPES;
    if(s){
      var n=parse(s), ex=PIPES.filter(function(p){return p[0]===n||npsNum(p[1])===n});
      rows=ex.length?ex:PIPES.filter(function(p){return String(p[0]).indexOf(s)===0});
    }
    tb.innerHTML=rows.length?rows.map(function(p){
      return '<tr><td>'+p[0]+'</td><td>'+npsLabel(p[1])+'</td><td>'+fix(p[2],1)+'</td><td>'+fix(p[2]/25.4,3)+'</td>'+
        '<td>'+fix(p[3],2)+'</td><td>'+fix(p[2]-2*p[3],1)+'</td><td>'+fix(p[4],2)+'</td><td>'+fix(p[2]-2*p[4],1)+'</td></tr>'
    }).join(''):'<tr><td colspan="8" style="text-align:left;font-family:var(--f-body);color:var(--muted)">Nenhum diâmetro encontrado.</td></tr>';
  }
  q.addEventListener('input',draw); draw();
}

/* ---------- campos reutilizáveis nas calculadoras ---------- */
function fld(id,label,val,unitsHTML,extra){
  return '<div class="field"><label for="'+id+'">'+label+'</label>'+
    (unitsHTML?'<div class="ctl"><input id="'+id+'" inputmode="decimal" autocomplete="off" value="'+val+'">'+unitsHTML+'</div>'
             :'<input id="'+id+'" inputmode="decimal" autocomplete="off" value="'+val+'"'+(extra||'')+'>')+'</div>';
}
function onAll(sel,fn){root.querySelectorAll(sel).forEach(function(e){e.addEventListener('input',fn);e.addEventListener('change',fn)})}
function chipRow(list,apply){
  var d=document.createElement('div'); d.className='chips'; d.innerHTML=chipsHTML(list);
  d.addEventListener('click',function(e){var b=e.target.closest('.chip');if(b)apply(list[+b.getAttribute('data-c')])});
  return d;
}

/* ---------- velocidade e Reynolds ---------- */
function viewEsc(){
  var QU=pick('vazao',['m³/h','L/s','L/min','GPM (US)','m³/s']);
  var dnOpts=PIPES.map(function(p,i){return '<option value="'+i+'"'+(p[0]===100?' selected':'')+'>DN '+p[0]+' · NPS '+npsLabel(p[1])+'</option>'}).join('');
  root.innerHTML=head('Velocidade e Reynolds','Informe a vazão e o tubo para obter a velocidade média do fluido e o regime de escoamento.')+
   '<div class="form">'+
    fld('q','Vazão volumétrica','50','<select id="qu" aria-label="Unidade de vazão">'+opts(QU,0)+'</select>')+
    '<div class="field"><label for="dn">Tubo</label><div class="ctl"><select id="dn" style="flex:1;max-width:none">'+dnOpts+'</select>'+
      '<select id="sch" aria-label="Schedule"><option value="3">Sch 40</option><option value="4">Sch 80</option></select></div></div>'+
    fld('di','Diâmetro interno manual (mm)','','', ' placeholder="usa a tabela"')+
    fld('rho','Densidade (kg/m³)','998,2')+
    fld('mu','Viscosidade dinâmica (cP)','1,002')+
   '</div><div id="fl"></div><h2 class="sec">Resultado</h2><div class="out" id="out"></div>'+
   '<p class="note">Referência usual para água em tubulação industrial: sucção entre 1 e 2 m/s, recalque entre 1,5 e 3 m/s. Regime pelo número de Reynolds: laminar abaixo de 2 300, turbulento acima de 4 000.</p>';
  $('#fl').appendChild(chipRow([[998.2,1.002,'Água 20 °C'],[983.2,0.467,'Água 60 °C'],[971.8,0.355,'Água 80 °C'],[1.204,0.01825,'Ar 20 °C, 1 atm']],function(c){
    $('#rho').value=fmtCopy(c[0]);$('#mu').value=fmtCopy(c[1]);run();
  }));
  function run(){
    var q=parse($('#q').value), Q=toBase(QU[$('#qu').selectedIndex],q), p=PIPES[+$('#dn').value], wall=p[+$('#sch').value];
    var man=parse($('#di').value), custom=isFinite(man)&&man>0, Dmm=custom?man:p[2]-2*wall, D=Dmm/1000;
    var A=Math.PI*D*D/4, v=Q/A, rho=parse($('#rho').value), mu=parse($('#mu').value)*1e-3, Re=rho*v*D/mu;
    var reg=!isFinite(Re)?'—':Re<2300?'Laminar':Re<=4000?'Transição':'Turbulento';
    function o(l,v,s){return '<div class="o"><span>'+l+'</span><b>'+v+'</b>'+(s?'<small>'+s+'</small>':'')+'</div>'}
    $('#out').innerHTML=
      o('Velocidade',fmtHTML(v)+' <small>m/s</small>',isFinite(v)?fmtHTML(v/0.3048)+' ft/s':'')+
      o('Número de Reynolds',fmtHTML(Re),'')+
      o('Regime','<span class="tag">'+reg+'</span>','')+
      o('Diâmetro interno',fmtHTML(Dmm)+' <small>mm</small>',(custom?'valor manual · ':'')+fmtHTML(Dmm/25.4)+' pol')+
      o('Área de passagem',fmtHTML(A*1e4)+' <small>cm²</small>','');
  }
  onAll('.form input,.form select',run); run();
}

/* ---------- par de campos ligados (editar um recalcula o outro) ---------- */
function linkPair(a,b,extras,conv){
  var last='a';
  function run(){
    var s=last==='a'?a:b, t=last==='a'?b:a, v=parse(s.inp.value);
    if(!isFinite(v)){t.inp.value='';return}
    var out=fromBase(t.units[t.sel.selectedIndex],conv(last,toBase(s.units[s.sel.selectedIndex],v)));
    t.inp.value=isFinite(out)?fmtCopy(out):'';
  }
  [[a,'a'],[b,'b']].forEach(function(p){
    p[0].inp.addEventListener('input',function(){last=p[1];run()});
    p[0].sel.addEventListener('change',run);
  });
  extras.forEach(function(e){e.addEventListener('input',run)});
  run();
  return run;
}
function side(inpId,selId,units){return {inp:$(inpId),sel:$(selId),units:units}}

/* ---------- vazão mássica ↔ volumétrica ---------- */
function viewMass(){
  var VU=pick('vazao',['m³/h','L/s','L/min','GPM (US)','m³/s']);
  var MU=[u('kg/h','',1/3600),u('kg/s','',1),u('t/h','',1000/3600),u('lb/h','',0.45359237/3600)];
  var DEN=[[998.2,'Água 20 °C'],[1025,'Água do mar'],[840,'Diesel ≈ 840'],[13546,'Mercúrio']];
  root.innerHTML=head('Vazão mássica e volumétrica','Edite qualquer um dos dois campos. A densidade faz a ponte entre eles: ṁ = ρ × Q.')+
   '<div class="form">'+
    fld('a','Vazão volumétrica','100','<select id="au" aria-label="Unidade volumétrica">'+opts(VU,0)+'</select>')+
    fld('b','Vazão mássica','','<select id="bu" aria-label="Unidade mássica">'+opts(MU,0)+'</select>')+
    fld('rho','Densidade (kg/m³)','998,2')+
   '</div><div id="fl"></div>';
  var run=linkPair(side('#a','#au',VU),side('#b','#bu',MU),[$('#rho')],function(dir,x){
    var r=parse($('#rho').value); return dir==='a'?x*r:x/r;
  });
  $('#fl').appendChild(chipRow(DEN,function(c){$('#rho').value=fmtCopy(c[0]);run()}));
  root.insertAdjacentHTML('beforeend','<p class="note">Para gases, use a densidade nas condições de operação, não a normal.</p>');
}

/* ---------- Nm³/h ↔ m³/h real ---------- */
function viewGas(){
  var VU=pick('vazao',['m³/h','m³/min','L/min','ft³/min','m³/s']);
  var PRE=[[0,1.01325,'Normal (0 °C, 1,01325 bar)'],[15,1.01325,'ISO 2533 (15 °C)'],[15.56,1.01325,'EUA (60 °F, 14,696 psia)'],[20,1.01325,'NTP (20 °C)']];
  root.innerHTML=head('Gás: vazão normal e real','Converte vazão em condições de referência (Nm³/h, Sm³/h) para vazão real na pressão e temperatura de operação, tratando o gás como ideal.')+
   '<h2 class="sec">Vazão</h2><div class="form">'+
    fld('a','Vazão na condição de referência','100','<select id="au" aria-label="Unidade de referência">'+opts(VU,0)+'</select>')+
    fld('b','Vazão real de operação','','<select id="bu" aria-label="Unidade real">'+opts(VU,0)+'</select>')+
   '</div><h2 class="sec">Condição de referência</h2><div class="form">'+
    fld('pr','Pressão absoluta (bar)','1,01325')+fld('tr','Temperatura (°C)','0')+
   '</div><div id="fl"></div><h2 class="sec">Condição de operação</h2><div class="form">'+
    fld('po','Pressão manométrica (bar)','7')+fld('pa','Pressão atmosférica local (bar)','1,01325')+fld('to','Temperatura (°C)','25')+
   '</div><p class="note">Q real = Q ref × (P ref ÷ P op abs) × (T op ÷ T ref), com temperaturas em kelvin. Sem fator de compressibilidade (Z = 1).</p>';
  var run=linkPair(side('#a','#au',VU),side('#b','#bu',VU),['#pr','#tr','#po','#pa','#to'].map(function(s){return $(s)}),function(dir,x){
    var k=(parse($('#pr').value)/(parse($('#po').value)+parse($('#pa').value)))*((parse($('#to').value)+273.15)/(parse($('#tr').value)+273.15));
    return dir==='a'?x*k:x/k;
  });
  $('#fl').appendChild(chipRow(PRE,function(c){$('#tr').value=fmtCopy(c[0]);$('#pr').value=fmtCopy(c[1]);run()}));
}

/* ---------- pressão ↔ coluna de fluido ---------- */
function viewCol(){
  var PU=pick('pressao',['bar','kgf/cm²','psi','kPa','MPa','atm']);
  var HU=pick('comprimento',['m','ft','mm','in']);
  var DEN=[[998.2,'Água 20 °C'],[1025,'Água do mar'],[840,'Diesel ≈ 840'],[13546,'Mercúrio']];
  root.innerHTML=head('Pressão e coluna de fluido','Relaciona a pressão com a altura de uma coluna de líquido: P = ρ × g × h. Serve para altura manométrica, NPSH e leitura de manômetros.')+
   '<div class="form">'+
    fld('a','Pressão','1','<select id="au" aria-label="Unidade de pressão">'+opts(PU,0)+'</select>')+
    fld('b','Altura da coluna','','<select id="bu" aria-label="Unidade de altura">'+opts(HU,0)+'</select>')+
    fld('rho','Densidade do fluido (kg/m³)','998,2')+
   '</div><div id="fl"></div>';
  var G=9.80665;
  var run=linkPair(side('#a','#au',PU),side('#b','#bu',HU),[$('#rho')],function(dir,x){
    var r=parse($('#rho').value); return dir==='a'?x/(r*G):x*r*G;
  });
  $('#fl').appendChild(chipRow(DEN,function(c){$('#rho').value=fmtCopy(c[0]);run()}));
  root.insertAdjacentHTML('beforeend','<p class="note">Com água a 20 °C, 1 bar equivale a cerca de 10,2 m de coluna. Use g = 9,80665 m/s².</p>');
}

/* ---------- navegação ---------- */
var V={
  'tabela-dn':{name:'Tabela DN / NPS',render:viewTable},
  'calc-escoamento':{name:'Velocidade e Reynolds',render:viewEsc},
  'calc-massica':{name:'Vazão mássica',render:viewMass},
  'calc-gas':{name:'Gás: Nm³/h',render:viewGas},
  'calc-coluna':{name:'Pressão × coluna',render:viewCol}
};
var NAV=[
  ['Escoamento',['pressao','vazao','velocidade','densidade','visc-din','visc-cin']],
  ['Geometria',['comprimento','area','volume']],
  ['Mecânica',['massa','forca','torque']],
  ['Térmica',['temperatura','energia','potencia','cond-termica','troca-termica']],
  ['Calculadoras de tubulação',['tabela-dn','calc-escoamento','calc-massica','calc-gas','calc-coluna']]
];
$('#nav').innerHTML=NAV.map(function(g){
  return '<div class="grp"><h2>'+esc(g[0])+'</h2>'+g[1].map(function(id){
    return '<a href="#'+id+'" data-id="'+id+'">'+esc(C[id]?C[id].name:V[id].name)+'</a>'}).join('')+'</div>';
}).join('');

function route(){
  var id=decodeURIComponent(location.hash.slice(1));
  if(!C[id]&&!V[id])id='pressao';
  document.querySelectorAll('#nav a').forEach(function(a){
    if(a.getAttribute('data-id')===id){a.setAttribute('aria-current','page');if(window.matchMedia('(max-width:860px)').matches){var n=$('#nav');n.scrollLeft=Math.max(0,a.offsetLeft-16)}}
    else a.removeAttribute('aria-current');
  });
  if(C[id])viewConv(C[id]); else V[id].render();
}
window.addEventListener('hashchange',route);
route();
})();
</script>
